name: Apply mobile image layout fix

on:
  push:
    branches:
      - fix/mobile-image-layout

permissions:
  contents: write

jobs:
  fix-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile pharmacist image and hero crop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/styles.css')
          s = p.read_text()
          s = s.replace('''  .service-pharmacist {\n    display: none;\n  }''', '''  .service-pharmacist {\n    display: block;\n    width: min(100%, 270px);\n    height: clamp(300px, 78vw, 370px);\n    justify-self: center;\n    object-fit: cover;\n    object-position: center top;\n  }''')
          marker = '/* Mobile image layout fix: show pharmacist and fill hero. */'
          extra = '''\n\n/* Mobile image layout fix: show pharmacist and fill hero. */\n@media (max-width: 860px) {\n  .home-hero-visual {\n    width: 100%;\n    height: clamp(280px, 78vw, 460px);\n    min-height: 280px;\n  }\n\n  .home-hero-image {\n    object-fit: cover;\n    object-position: center;\n  }\n}\n'''
          if marker not in s:
              s += extra
          p.write_text(s)
          PY
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles.css package-lock.json
          git diff --cached --quiet || git commit -m 'fix: show pharmacist image and fill mobile hero'
          git push